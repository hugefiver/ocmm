name: DSMM Release

on:
  push:
    tags:
      - "dsmm-scoped-v*.*.*"

permissions:
  contents: read

concurrency:
  group: dsmm-npm-publication
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    env:
      DSMM_RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.9.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Set package version from tag
        run: |
          version="${DSMM_RELEASE_TAG#dsmm-scoped-v}"
          npm --prefix dsmm pkg set "version=$version"
          printf 'DSMM_VERSION=%s\n' "$version" >> "$GITHUB_ENV"
      - name: Build DSMM
        run: |
          node dsmm/scripts/materialize-frontend.mjs --sync
          pnpm --dir dsmm run build
          pnpm --dir dsmm run generate:roles
      - name: Pack DSMM
        run: |
          mkdir "$RUNNER_TEMP/dsmm-release"
          pnpm --dir dsmm pack --pack-destination "$RUNNER_TEMP/dsmm-release"
      - name: Generate release checksum
        working-directory: ${{ runner.temp }}/dsmm-release
        run: sha256sum "dsmm-dsmm-${DSMM_VERSION}.tgz" > SHA256SUMS.txt
      - name: Retain release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dsmm-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/dsmm-release/
          if-no-files-found: error
          retention-days: 14
      - name: Publish to npm
        working-directory: ${{ runner.temp }}/dsmm-release
        run: npm publish "./dsmm-dsmm-${DSMM_VERSION}.tgz" --access public --registry=https://registry.npmjs.org/ --ignore-scripts --provenance --fetch-retries=0
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$DSMM_RELEASE_TAG" \
            "$RUNNER_TEMP/dsmm-release/dsmm-dsmm-${DSMM_VERSION}.tgz" \
            "$RUNNER_TEMP/dsmm-release/SHA256SUMS.txt" \
            --verify-tag --title "DSMM ${DSMM_VERSION}" \
            --notes "DSMM ${DSMM_VERSION}. Requires DSH 0.2.1-rc.2."
