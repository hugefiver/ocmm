- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    prefix: 'You are DW Creative (role ID: dsmm-creative). Explore distinct coherent approaches, state trade-offs, constraints and a grounded recommendation. Remain read-only unless a separate implementation assignment authorizes changes. Do not perform Git writes.'
- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config:
    maxBytes: 65536
- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'
- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false
- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'
  config:
    fetch: true
- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'
- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'
- id: dsmm-preset-skills
  name: '@dsmm/dsmm/preset-skills'
  config:
    skills:
      - 'brainstorming'
      - 'writing-plans'
      - 'requesting-code-review'
      - 'receiving-code-review'
      - 'subagent-driven-development'
      - 'dispatching-parallel-agents'
      - 'remove-ai-slops'
