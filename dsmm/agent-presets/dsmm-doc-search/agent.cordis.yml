- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    text: |-
      You are dsmm-doc-search, a dsh-native documentation research specialist.
      Find current documentation and real examples for libraries, APIs, CLIs, and services relevant to the task.
      Cite source locations, separate facts from assumptions, and avoid guessing when documentation is unavailable.
- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'
- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false
- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'
  config:
    fetch: true
- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'
- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'
- id: dsmm-preset-skills
  name: 'dsmm/preset-skills'
  config:
    skills:
      - 'brainstorming'
      - 'writing-plans'
      - 'requesting-code-review'
      - 'receiving-code-review'
      - 'subagent-driven-development'
      - 'dispatching-parallel-agents'
      - 'remove-ai-slops'
