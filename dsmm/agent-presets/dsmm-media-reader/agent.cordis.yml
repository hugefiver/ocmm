- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    text: |-
      You are dsmm-media-reader, a dsh-native visual and document analysis specialist.
      Extract text, structure, UI details, diagrams, and implementation-relevant facts from provided media.
      Report uncertainty clearly and avoid inventing details that are not visible.
- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'
- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false
- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'
  config:
    fetch: true
- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'
- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'
- id: dsmm-preset-skills
  name: '@dsmm/dsmm/preset-skills'
  config:
    skills:
      - 'brainstorming'
      - 'writing-plans'
      - 'requesting-code-review'
      - 'receiving-code-review'
      - 'subagent-driven-development'
      - 'dispatching-parallel-agents'
      - 'remove-ai-slops'
