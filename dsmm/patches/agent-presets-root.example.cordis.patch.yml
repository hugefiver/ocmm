# Example only: dsmm does not auto-apply this patch.
#
# Use this from an explicit dsh profile/patch after enabling dsmm preset
# materialization with a matching `presets.root` value in the dsmm config.
# Patching `agent-presets` replaces the whole row, so restate default, roots,
# and includeUserRoot instead of only adding the dsmm root.
- id: agent-presets
  config:
    default: standard
    roots:
      # Replace this with the same absolute path configured as dsmm.presets.root.
      - path: /absolute/path/to/dsmm-managed-agent-presets
        trust: user
    includeUserRoot: true
